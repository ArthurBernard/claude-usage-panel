<svg xmlns="http://www.w3.org/2000/svg" width="420" height="430" viewBox="0 0 420 430" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- top bar -->
  <rect x="0" y="0" width="420" height="34" fill="#1b1b1d"/>
  <text x="16" y="22" fill="#d97757" font-size="13" font-weight="700">✳</text>
  <text x="34" y="22" fill="#e5484d" font-size="13" font-weight="700">Fable 100%</text>
  <text x="300" y="22" fill="#8a8a8a" font-size="12">16:24</text>

  <!-- popup -->
  <g filter="url(#shadow)">
    <rect x="40" y="44" width="340" height="366" rx="18" fill="#232326" stroke="#ffffff14"/>
  </g>

  <!-- header -->
  <text x="60" y="78" fill="#ffffff" font-size="16" font-weight="800">Claude usage</text>
  <text x="360" y="78" fill="#9a948a" font-size="12" font-weight="600" text-anchor="end">Max (20x)</text>

  <!-- card: session -->
  <g>
    <rect x="58" y="92" width="304" height="70" rx="14" fill="#ffffff0a" stroke="#ffffff10"/>
    <text x="74" y="118" fill="#cfc9bd" font-size="13" font-weight="600">Current session  ●</text>
    <text x="346" y="119" fill="#e6e1d7" font-size="15" font-weight="800" text-anchor="end">42%</text>
    <rect x="74" y="130" width="272" height="8" rx="4" fill="#ffffff1a"/>
    <rect x="74" y="130" width="114" height="8" rx="4" fill="#d97757"/>
    <text x="74" y="154" fill="#8f897e" font-size="11">Resets in 3h 06m</text>
  </g>

  <!-- card: weekly all -->
  <g>
    <rect x="58" y="172" width="304" height="70" rx="14" fill="#ffffff0a" stroke="#ffffff10"/>
    <text x="74" y="198" fill="#cfc9bd" font-size="13" font-weight="600">Weekly · all models</text>
    <text x="346" y="199" fill="#e6e1d7" font-size="15" font-weight="800" text-anchor="end">72%</text>
    <rect x="74" y="210" width="272" height="8" rx="4" fill="#ffffff1a"/>
    <rect x="74" y="210" width="196" height="8" rx="4" fill="#d97757"/>
    <text x="74" y="234" fill="#8f897e" font-size="11">Resets in 3d 14h</text>
  </g>

  <!-- card: fable (critical) -->
  <g>
    <rect x="58" y="252" width="304" height="70" rx="14" fill="#ffffff0a" stroke="#e5484d33"/>
    <text x="74" y="278" fill="#cfc9bd" font-size="13" font-weight="600">Weekly · Fable  ●</text>
    <text x="346" y="279" fill="#e5484d" font-size="15" font-weight="800" text-anchor="end">100%</text>
    <rect x="74" y="290" width="272" height="8" rx="4" fill="#ffffff1a"/>
    <rect x="74" y="290" width="272" height="8" rx="4" fill="#e5484d"/>
    <text x="74" y="314" fill="#8f897e" font-size="11">Resets in 3d 14h</text>
  </g>

  <!-- footer -->
  <text x="74" y="346" fill="#d1cbbf" font-size="12" font-weight="600">Session cost: $2.14 · 340k tokens</text>
  <text x="74" y="364" fill="#7c766b" font-size="11">Updated 16:24</text>

  <line x1="58" y1="378" x2="362" y2="378" stroke="#ffffff12"/>
  <text x="74" y="398" fill="#c9c4b8" font-size="12">↻  Refresh now</text>
</svg>
