name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: node --test "tests/*.test.js"

  swift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - run: swift test
        working-directory: macos
